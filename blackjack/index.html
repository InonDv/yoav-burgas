<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בלאקג'ק של יואב בבורגס</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <nav class="game-nav">
    <a href="../">דף הבית</a>
    <a href="../russian/">רולטה רוסית</a>
    <a href="../poker/">פוקר</a>
    <a href="../american/">רולטה אמריקאית</a>
    <a href="../casino/">קזינו</a>
    <a href="../scratch/">גירוד</a>
    <a href="../blackjack/">בלאקג'ק</a>
    <a href="../ace-king/">אס זוכה</a>
    <a href="../cups/">גביע</a>
    <a href="../bingo/">בינגו</a>
    <a href="../memory/">זיכרון</a>
  </nav>

  <main class="stage">
    <p class="hint">לחץ על הקוביה להתחלה. קח קלף או עמוד. 21 או יותר מהדילר = זכייה</p>

    <section class="table">
      <div class="seat">
        <p class="seat-label">דילר <span id="dealerScore"></span></p>
        <div class="row" id="dealerRow" dir="ltr"></div>
      </div>
      <div class="seat">
        <p class="seat-label">יואב <span id="playerScore"></span></p>
        <div class="row" id="playerRow" dir="ltr"></div>
      </div>
      <div class="actions" id="actions" hidden>
        <button type="button" id="hitBtn">קח קלף</button>
        <button type="button" id="standBtn">עמוד</button>
      </div>
      <p class="status" id="status"></p>
    </section>

    <button class="cube-button" id="cubeButton" type="button" aria-label="מחולל הבחורות של יואב בבורגס">
      <div class="scene">
        <div class="cube" id="cube">
          <div class="face front"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face back"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face right"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face left"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face top"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face bottom"><span>מחולל הבחורות של יואב בבורגס</span></div>
        </div>
      </div>
    </button>
  </main>

  <div class="jackpot" id="jackpot" hidden aria-hidden="true">
    <div class="jackpot-card">
      <p class="jackpot-title">זכית בבחורה</p>
      <p class="jackpot-sub">למימוש פנה לקבלה</p>
    </div>
  </div>

  <script src="../shared/models.js"></script>
  <script src="script.js"></script>
</body>
</html>
