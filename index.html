<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מחולל הבחורות של יואב בבורגס</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <main class="home">
    <h1>מחולל הבחורות של יואב בבורגס</h1>
    <p>בחר משחק</p>
    <div class="choices">
      <a class="choice casino-card" href="casino/">
        <span class="choice-kicker">3 גלגלים</span>
        <strong>קזינו</strong>
      </a>
      <a class="choice poker-card" href="poker/">
        <span class="choice-kicker">5 קלפים</span>
        <strong>פוקר</strong>
      </a>
      <a class="choice scratch-card" href="scratch/">
        <span class="choice-kicker">גרד וגלה</span>
        <strong>גירוד</strong>
      </a>
      <a class="choice blackjack-card" href="blackjack/">
        <span class="choice-kicker">21</span>
        <strong>בלאקג'ק</strong>
      </a>
      <a class="choice aceking-card" href="ace-king/">
        <span class="choice-kicker">קלף אחד</span>
        <strong>אס זוכה קינג בוכה</strong>
      </a>
      <a class="choice cups-card" href="cups/">
        <span class="choice-kicker">3 גביעים</span>
        <strong>הפוך את הגביע</strong>
      </a>
      <a class="choice bingo-card" href="bingo/">
        <span class="choice-kicker">לוח 3x3</span>
        <strong>בינגו</strong>
      </a>
      <a class="choice memory-card" href="memory/">
        <span class="choice-kicker">זוגות</span>
        <strong>משחק הזיכרון</strong>
      </a>
      <a class="choice russian-card" href="russian/">
        <span class="choice-kicker">6 תאים</span>
        <strong>רולטה רוסית</strong>
      </a>
    </div>
  </main>
</body>
</html>
