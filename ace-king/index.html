<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אס זוכה קינג בוכה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <nav class="game-nav">
    <a href="../">דף הבית</a>
    <a href="../casino/">קזינו</a>
    <a href="../poker/">פוקר</a>
    <a href="../scratch/">גירוד</a>
    <a href="../blackjack/">בלאקג'ק</a>
    <a href="../ace-king/">אס זוכה</a>
    <a href="../cups/">גביע</a>
    <a href="../bingo/">בינגו</a>
    <a href="../memory/">זיכרון</a>
    <a href="../russian/">רולטה רוסית</a>
  </nav>

  <main class="stage">
    <p class="hint">לחץ על הקוביה להפוך קלף</p>
    <p class="machine-sign">אס זוכה · קינג בוכה</p>

    <article class="hero-card" id="heroCard">
      <div class="card-inner">
        <div class="card-back"></div>
        <div class="card-front">
          <img id="heroPhoto" alt="קלף" />
          <span class="rank" id="heroRank"></span>
        </div>
      </div>
    </article>

    <p class="status" id="status"></p>

    <button class="cube-button" id="cubeButton" type="button" aria-label="מחולל הבחורות של יואב בבורגס">
      <div class="scene">
        <div class="cube" id="cube">
          <div class="face front"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face back"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face right"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face left"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face top"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face bottom"><span>מחולל הבחורות של יואב בבורגס</span></div>
        </div>
      </div>
    </button>
  </main>

  <div class="jackpot" id="jackpot" hidden aria-hidden="true">
    <div class="jackpot-card" id="resultCard">
      <p class="jackpot-title" id="resultTitle">זכית בבחורה</p>
      <p class="jackpot-sub" id="resultSub">למימוש פנה לקבלה</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
