<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>רולטה אמריקאית של יואב בבורגס</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <nav class="game-nav">
    <a href="../">דף הבית</a>
    <a href="../russian/">רולטה רוסית</a>
    <a href="../poker/">פוקר</a>
    <a href="../american/">רולטה אמריקאית</a>
    <a href="../casino/">קזינו</a>
    <a href="../scratch/">גירוד</a>
    <a href="../blackjack/">בלאקג'ק</a>
    <a href="../ace-king/">אס זוכה</a>
    <a href="../cups/">גביע</a>
    <a href="../bingo/">בינגו</a>
    <a href="../memory/">זיכרון</a>
  </nav>
  <main class="stage">
    <p class="hint">רולטה אמריקאית · 38 סלוטים כולל 0 ו־00.<br>מספר 35:1 · תריסר/טור 2:1 · אדום/שחור/זוגי/אי-זוגי/1-18/19-36 1:1</p>
    <div class="felt">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="560" height="560"></canvas>
      </div>
      <div class="bank-row">
        <p class="bank">קופה <strong id="bank">100</strong></p>
        <div class="denoms" id="denoms">
          <button type="button" data-chip="1" class="on">1</button>
          <button type="button" data-chip="5">5</button>
          <button type="button" data-chip="25">25</button>
          <button type="button" data-chip="100">100</button>
        </div>
        <button type="button" class="clear" id="clearBtn">נקה</button>
      </div>
      <div class="layout" id="layout" dir="ltr"></div>
    </div>
    <p class="status" id="status">בחר ז'טון ושים על השולחן</p>
    <button class="act reload" id="reloadBtn" type="button" hidden>טען 100 ז'טונים</button>
    <button class="cube-button" id="cubeButton" type="button" aria-label="מחולל הבחורות של יואב בבורגס">
      <div class="scene"><div class="cube" id="cube">
        <div class="face front"><span>מחולל הבחורות של יואב בבורגס</span></div>
        <div class="face back"><span>מחולל הבחורות של יואב בבורגס</span></div>
        <div class="face right"><span>מחולל הבחורות של יואב בבורגס</span></div>
        <div class="face left"><span>מחולל הבחורות של יואב בבורגס</span></div>
        <div class="face top"><span>מחולל הבחורות של יואב בבורגס</span></div>
        <div class="face bottom"><span>מחולל הבחורות של יואב בבורגס</span></div>
      </div></div>
    </button>
  </main>
  <div class="jackpot" id="jackpot" hidden>
    <div class="jackpot-card">
      <img id="winnerPhoto" alt="">
      <p class="jackpot-title">זכית בבחורה</p>
      <p class="jackpot-sub">למימוש פנה לקבלה</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
