<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הפוקר של יואב בבורגס</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <nav class="game-nav">
    <a href="../">דף הבית</a>
    <a href="../casino/">קזינו</a>
    <a href="../poker/">פוקר</a>
    <a href="../scratch/">גירוד</a>
    <a href="../blackjack/">בלאקג'ק</a>
    <a href="../ace-king/">אס זוכה</a>
    <a href="../cups/">גביע</a>
    <a href="../bingo/">בינגו</a>
    <a href="../memory/">זיכרון</a>
    <a href="../russian/">רולטה רוסית</a>
    <a href="../american/">רולטה אמריקאית</a>
  </nav>
  <main class="stage">
    <p class="hint">כניסה 5 ז'טונים. בחר סכום הימור, ואז צ'ק או הימור. קוביה = יד חדשה</p>
    <p class="bank-row">קופה <strong id="bank">100</strong> · קופה במרכז <strong id="pot">0</strong></p>
    <p class="street-label" id="streetLabel">הבית</p>
    <section class="hand dealer" id="dealer" dir="ltr"></section>
    <p class="street-label">שולחן</p>
    <section class="hand board" id="board" dir="ltr"></section>
    <p class="street-label">היד שלך</p>
    <section class="hand hole" id="hole" dir="ltr"></section>
    <p class="status" id="status">לחץ על הקוביה להתחלת יד</p>
    <div class="actions">
      <div class="denoms" id="denoms">
        <button type="button" data-chip="1">1</button>
        <button type="button" data-chip="5" class="on">5</button>
        <button type="button" data-chip="10">10</button>
        <button type="button" data-chip="25">25</button>
      </div>
      <button type="button" class="act" id="checkBtn" disabled>צ'ק</button>
      <button type="button" class="act bet" id="betBtn" disabled>הימור 5</button>
      <button type="button" class="act reload" id="reloadBtn" hidden>טען ז'טונים</button>
    </div>
    <button class="cube-button" id="cubeButton" type="button" aria-label="מחולל הבחורות של יואב בבורגס">
      <div class="scene">
        <div class="cube" id="cube">
          <div class="face front"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face back"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face right"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face left"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face top"><span>מחולל הבחורות של יואב בבורגס</span></div>
          <div class="face bottom"><span>מחולל הבחורות של יואב בבורגס</span></div>
        </div>
      </div>
    </button>
  </main>
  <div class="jackpot" id="jackpot" hidden>
    <div class="jackpot-card">
      <img id="winnerPhoto" alt="">
      <p class="jackpot-title">זכית בבחורה</p>
      <p class="jackpot-sub">למימוש פנה לקבלה</p>
    </div>
  </div>
  <script src="../shared/models.js"></script>
  <script src="script.js"></script>
</body>
</html>
